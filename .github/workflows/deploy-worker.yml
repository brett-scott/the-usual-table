name: Deploy Cloudflare Worker
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-worker-production
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      CLOUDFLARE_RATE_LIMIT_NAMESPACE_ID: ${{ vars.CLOUDFLARE_RATE_LIMIT_NAMESPACE_ID }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_WALLET_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_WALLET_HYPERDRIVE_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate production binding and migration bundle
        run: npm run deploy:worker -- --dry-run
      - name: Deploy Worker and its SQLite Durable Object migration
        run: npm run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
