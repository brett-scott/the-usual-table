name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      VITE_BASE_PATH: /casual-check/
      VITE_API_BASE_URL: http://127.0.0.1:8787
      E2E_BASE_PATH: /casual-check/
      E2E_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Production subpath browser acceptance
        run: npm run test:e2e -- --workers=4
      - name: Validate production Worker configuration without deployment
        run: npm run deploy:worker -- --dry-run
        env:
          CLOUDFLARE_WORKER_NAME: the-usual-table-api-production
          CLOUDFLARE_ACCOUNT_ID: '00000000000000000000000000000000'
          CLOUDFLARE_RATE_LIMIT_NAMESPACE_ID: '102802'
          ALLOWED_ORIGINS: https://example.test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
