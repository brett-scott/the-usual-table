name: Checks
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build -w @casual/server
      - run: npx playwright install --with-deps chromium
      - name: Production subpath browser acceptance
        run: npm run test:e2e:ci
      - name: Validate production Worker configuration without deployment
        run: npm run deploy:worker -- --dry-run
        env:
          CLOUDFLARE_WORKER_NAME: the-usual-table-api-production
          CLOUDFLARE_ACCOUNT_ID: '00000000000000000000000000000000'
          CLOUDFLARE_RATE_LIMIT_NAMESPACE_ID: '102802'
          CLOUDFLARE_WALLET_HYPERDRIVE_ID: '11111111111111111111111111111111'
          ALLOWED_ORIGINS: https://example.test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
